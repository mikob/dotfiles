interface:
  display_name: "GitHub Issue to PR"
  short_description: "Fix the oldest open issue and create a pull request"
  default_prompt: "Use $github-issue-to-pr in the current repository: start with the oldest open issue, branch from dev or else main or master, implement and test a fix, and open a PR. Ask for clarification in both this task and the GitHub issue at the same time, use the first response, and check GitHub hourly while waiting."
